<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seyfi Balık Restaurant Yalıkavak basılabilir QR menü kartı.">
  <title>QR Masa Kartı | Seyfi Balık Restaurant Yalıkavak</title>
  <script src="./site-data.js"></script>
  <style>
    :root {
      --ink: #060807;
      --night: #101817;
      --pearl: #f8f2e8;
      --muted: rgba(248, 242, 232, .72);
      --gold: #c9a96e;
      --line: rgba(201, 169, 110, .34);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #151515;
      color: var(--pearl);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .sheet {
      width: min(100%, 430px);
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(rgba(6, 8, 7, .82), rgba(6, 8, 7, .92)),
        url("./assets/instagram-menu/venue-floral-entry.jpg") center/cover no-repeat;
      padding: 34px 28px 30px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .38);
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      line-height: .95;
    }

    .sub {
      margin: 14px auto 24px;
      max-width: 290px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .qr-wrap {
      width: min(100%, 292px);
      margin: 0 auto;
      border: 1px solid rgba(201, 169, 110, .5);
      background: #fff;
      padding: 14px;
    }

    .qr-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .scan {
      margin: 22px 0 0;
      color: var(--pearl);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .small {
      margin: 8px 0 0;
      color: rgba(248, 242, 232, .66);
      font-size: 12px;
      line-height: 1.5;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }

    .tools a,
    .tools button {
      min-height: 44px;
      border: 1px solid rgba(201, 169, 110, .45);
      background: transparent;
      color: var(--gold);
      padding: 0 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    @media print {
      @page { size: 105mm 148mm; margin: 0; }
      body {
        min-height: 148mm;
        padding: 0;
        background: #fff;
      }
      .sheet {
        width: 105mm;
      }
      .card {
        width: 105mm;
        min-height: 148mm;
        box-shadow: none;
        border: 0;
      }
      .tools { display: none; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <section class="card">
      <p class="eyebrow">Dijital menü</p>
      <h1 id="restaurant-name">Seyfi Balık</h1>
      <p class="sub">Menüyü görmek için kameranızla QR kodu okutun.</p>
      <div class="qr-wrap">
        <img id="qr-image" src="./assets/qr/seyfi-qr-menu.svg" alt="Seyfi Balık Restaurant Yalıkavak QR menü kodu" width="1200" height="1200">
      </div>
      <p class="scan">Menü · Instagram · Web Sitesi</p>
      <p class="small" id="landing-url">dagdelenbatu14-pixel.github.io/yali-kiyi-balik-restaurant/qr.html</p>
    </section>

    <div class="tools" aria-label="QR çıktıları">
      <button type="button" onclick="window.print()">Yazdır</button>
      <a id="png-link" href="./assets/qr/seyfi-qr-menu.png" download>PNG İndir</a>
      <a id="svg-link" href="./assets/qr/seyfi-qr-menu.svg" download>SVG İndir</a>
    </div>
  </main>

  <script>
    const data = window.SITE_DATA || {};
    const brand = data.brand || {};
    const qr = data.qr || {};

    document.title = `QR Masa Kartı | ${brand.name || "Seyfi Balık Restaurant Yalıkavak"}`;
    document.getElementById("restaurant-name").textContent = brand.shortName || brand.name || "Seyfi Balık";
    document.getElementById("landing-url").textContent = (brand.qrLandingUrl || "").replace(/^https?:\/\//, "");
    document.getElementById("qr-image").src = qr.svgUrl || "./assets/qr/seyfi-qr-menu.svg";
    document.getElementById("png-link").href = qr.pngUrl || "./assets/qr/seyfi-qr-menu.png";
    document.getElementById("svg-link").href = qr.svgUrl || "./assets/qr/seyfi-qr-menu.svg";
  </script>
</body>
</html>
